name: Temporary LoguberSys smoke check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live NÓ page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            --dump-header /tmp/no-headers.txt \
            --output /tmp/no-body.html \
            https://logubersys.cloud/no/
          cat /tmp/no-headers.txt
          grep -Fi 'X-Loguber-Public-Page: no' /tmp/no-headers.txt
          grep -F '<title>NÓ — Uma operação conectada</title>' /tmp/no-body.html
          grep -F 'Uma operação que' /tmp/no-body.html
