<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b1b55"><title>Amanhã — Preview público</title><style>:root{--p:#2b1b55;--bg:#f7f5f2;--ink:#17151b;--muted:#7c7680;--line:#e5e0da;--g:#e2f5e7;--gt:#17653e;--y:#fff0c9;--yt:#a56b00;--r:#fde0e4;--rt:#b72437}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.auth{position:fixed;inset:0;background:var(--bg);z-index:50;padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column}.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800}.mark{width:42px;height:42px;border-radius:14px;background:var(--p);display:grid;place-items:center;color:#f5d879}.heroart{margin:30px 0 26px;height:210px;border-radius:30px;background:linear-gradient(150deg,#332066,#513786);position:relative;overflow:hidden;color:#fff}.heroart:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-34px;height:95px;background:#211443;border-radius:50% 50% 0 0}.heroart strong{position:absolute;left:24px;top:30px;font-size:25px;line-height:1.05;z-index:2}.auth h1{font-size:40px;line-height:1.02;letter-spacing:-.055em;margin:0 0 10px}.auth p{color:var(--muted);line-height:1.5;font-size:14px}.push{margin-top:auto;display:grid;gap:10px}.primary,.secondary{height:54px;border-radius:15px;font-weight:750;font-size:15px}.primary{border:0;background:var(--p);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.link{border:0;background:none;color:#5b3bd1;font-weight:750}.login{display:none}.field{margin:13px 0}.field label{display:block;font-size:10px;font-weight:800;color:#6f6873;margin-bottom:7px}.field input{width:100%;padding:15px 14px;border:1px solid #ddd8d3;background:#fff;border-radius:13px;font-size:16px}.app{display:none;min-height:100vh;padding-bottom:calc(82px + env(safe-area-inset-bottom))}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(250,249,247,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);height:calc(74px + env(safe-area-inset-bottom));padding:7px 12px env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}.bottom button{border:0;background:none;color:#8d8790;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}.bottom .ic{font-size:24px}.bottom button.active{color:var(--p)}.bottom .plus{width:58px;height:58px;border-radius:18px;background:var(--p);color:#fff;font-size:32px;margin-top:-24px;justify-self:center}.page{padding:max(20px,env(safe-area-inset-top)) 20px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;color:#8d8790}.title{font-size:30px;font-weight:830;letter-spacing:-.045em;margin:4px 0}.circle{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px}.hero{background:var(--p);color:#fff;border-radius:28px;padding:24px;margin:18px 0}.hero small{font-size:9px;letter-spacing:.16em;color:#d3c8e7;font-weight:800}.hero h2{font-size:44px;margin:10px 0 7px;letter-spacing:-.055em}.hero p{font-size:13px;color:#d6cee5;line-height:1.45}.hero .secondary{width:auto;padding:0 16px;background:#ffffff16;border-color:#ffffff33;color:#fff}.metrics{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric{padding:15px 0}.metric:nth-child(odd){padding-right:12px;border-right:1px solid var(--line)}.metric:nth-child(even){padding-left:12px}.metric:nth-child(-n+2){border-bottom:1px solid var(--line)}.metric small{font-size:9px;color:#918b94;letter-spacing:.1em}.metric b{display:block;font-size:20px;margin-top:5px}.section{padding-top:24px}.section h3{font-size:21px;margin:0 0 12px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;text-align:left}.quick b{display:block}.quick small{color:var(--muted)}.monthnav{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center;background:#ece8e3;border-radius:18px;padding:6px;margin:12px 0 17px}.monthnav button{height:43px;border:0;background:#fff;border-radius:13px;color:var(--p);font-size:25px}.monthnav strong{text-align:center;font-size:17px}.today{grid-column:1/-1;background:none!important;height:22px!important;font-size:10px!important;color:#5b3bd1!important;font-weight:800}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week span{text-align:center;font-size:9px;color:#938d96;padding:4px 0 7px}.cell{min-height:72px}.cell.blank{visibility:hidden}.cell button{width:100%;height:100%;min-height:70px;border:0;border-radius:13px;background:#fff;padding:8px 2px;color:var(--ink)}.cell strong{font-size:14px;display:block}.cell em{font-style:normal;font-size:8px;display:block;margin-top:8px;color:var(--muted);font-weight:700}.cell.g button{background:var(--g)}.cell.g strong,.cell.g em{color:var(--gt)}.cell.y button{background:var(--y)}.cell.y strong,.cell.y em{color:var(--yt)}.cell.r button{background:var(--r)}.cell.r strong,.cell.r em{color:var(--rt)}.cell.todayday button{box-shadow:inset 0 0 0 2px var(--p)}.legend{display:flex;justify-content:center;gap:14px;color:var(--muted);font-size:9px;margin:11px 0 16px}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.legend .a{background:#75c58d}.legend .b{background:#e0b448}.legend .c{background:#e7707c}.strip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:19px;background:#fff;overflow:hidden}.strip div{padding:14px 7px;text-align:center;border-right:1px solid var(--line)}.strip div:last-child{border:0}.strip small{font-size:8px;color:#8e8891}.strip b{display:block;margin-top:5px}.simulate{width:100%;margin-top:14px;min-height:54px;border-radius:17px;border:1px solid #d9cdf0;background:#f0eafb;color:var(--p);font-weight:800}.list{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:15px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.in{color:#16965c}.out{color:#d84a4a}.cardbox{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}.cardbox h3{margin:0}.menu{display:grid;gap:0;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.menu button{border:0;border-bottom:1px solid var(--line);background:#fff;padding:16px;text-align:left;display:flex;justify-content:space-between}.menu button:last-child{border:0}.sheet{position:fixed;inset:0;z-index:60;background:#0006;display:none;align-items:flex-end}.sheet.open{display:flex}.panel{width:100%;max-height:87vh;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:2px 0 15px;font-size:26px}.close{width:38px;height:38px;border-radius:50%;border:0;background:#ece8e3;font-size:22px}.actions{display:grid;gap:9px}.actions button{padding:16px;border:1px solid var(--line);background:#fff;border-radius:15px;text-align:left}.actions b{display:block}.actions small{color:var(--muted)}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#17151be8;color:#fff;padding:10px 14px;border-radius:12px;font-size:11px;z-index:80;display:none;white-space:nowrap}.toast.show{display:block}</style></head><body><section class="auth" id="auth"><div id="welcome"><div class="logo"><div class="mark">◒</div>Amanhã</div><div class="heroart"><strong>Entenda hoje.<br>Decida melhor<br>o amanhã.</strong></div><h1>Seu dinheiro,<br>com mais clareza.</h1><p>Veja quanto terá em cada dia e simule decisões antes de gastar.</p><div class="push"><button class="primary" onclick="showLogin()">Entrar</button><button class="secondary" onclick="demo()">Explorar demonstração</button></div></div><div class="login" id="login"><button class="circle" onclick="backWelcome()">‹</button><h1 style="margin-top:26px">Entrar no Amanhã</h1><p>Use dados fictícios neste protótipo.</p><div class="field"><label>E-mail</label><input value="demo@amanha.app"></div><div class="field"><label>Senha</label><input type="password" value="12345678"></div><button class="primary" style="width:100%;margin-top:10px" onclick="demo()">Entrar</button><button class="link" style="width:100%;margin-top:10px">Esqueci minha senha</button></div></section><main class="app" id="app"><div id="content"></div><nav class="bottom"><button data-tab="home"><span class="ic">⌂</span>Início</button><button data-tab="horizon"><span class="ic">◒</span>Horizonte</button><button class="plus" id="plus">＋</button><button data-tab="cards"><span class="ic">▣</span>Cartões</button><button data-tab="profile"><span class="ic">○</span>Perfil</button></nav></main><div class="sheet" id="sheet"><div class="panel"><div class="sheethead"><div><div class="eyebrow" id="sheetEye"></div><h2 id="sheetTitle"></h2></div><button class="close" onclick="closeSheet()">×</button></div><div id="sheetBody"></div></div></div><div class="toast" id="toast"></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];let tab='home',yr=2026,mo=8;const state={balance:1500,reserve:500,income:5000,incomeDay:5,flex:1800,cards:[{name:'Nubank',bill:720,due:10,limit:6000},{name:'Inter',bill:340,due:18,limit:4500}],tx:[{name:'Renda principal',v:5000,d:5,t:'in',rec:true},{name:'Aluguel',v:-1800,d:7,t:'out',rec:true},{name:'Internet',v:-120,d:10,t:'out',rec:true},{name:'Vídeo game 1/5',v:-720,d:10,t:'out',rec:true},{name:'Academia',v:-99,d:15,t:'out',rec:true}]};function fmt(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function short(v){if(Math.abs(v)>=1000)return 'R$ '+(v/1000).toFixed(1).replace('.',',')+'k';return 'R$ '+Math.round(v)}function showLogin(){$('#welcome').style.display='none';$('#login').style.display='block'}function backWelcome(){$('#login').style.display='none';$('#welcome').style.display='block'}function demo(){$('#auth').style.display='none';$('#app').style.display='block';render()}function days(y,m){return new Date(y,m+1,0).getDate()}function monthStart(y,m){let bal=state.balance;let curY=2026,curM=8;if(y===curY&&m===curM)return bal;let step=(y*12+m)-(curY*12+curM);let sign=step>0?1:-1;for(let k=0;k<Math.abs(step);k++){bal+=sign*(state.income+state.tx.filter(x=>x.rec&&x.t==='out').reduce((a,x)=>a+x.v,0)-state.flex)}return bal}function daily(y,m){let bal=monthStart(y,m),out=[],n=days(y,m);for(let d=1;d<=n;d++){let items=state.tx.filter(x=>x.rec&&x.d===d);for(const x of items)bal+=x.v;bal-=state.flex/n;out.push({d,b:bal,items})}return out}function nextIncomeDays(y,m,d){if(d<state.incomeDay)return state.incomeDay-d;return days(y,m)-d+state.incomeDay}function tone(b,y,m,d){let dd=Math.max(1,nextIncomeDays(y,m,d));let need=state.flex/30*dd+250;if(b<0||b<need*.7)return'r';if(b<need*1.35)return'y';return'g'}function metrics(){const a=daily(yr,mo),min=Math.min(...a.map(x=>x.b));return{min,free:min-reserve}}function nav(){const map={home:0,horizon:1,cards:3,profile:4};$$('.bottom button').forEach(b=>b.classList.remove('active'));const b=$$('.bottom button')[map[tab]];if(b)b.classList.add('active')}function render(){nav();if(tab==='home')home();if(tab==='horizon')horizon();if(tab==='cards')cards();if(tab==='profile')profile()}function home(){const m=metrics();$('#content').innerHTML=`<section class="page"><div class="top"><div class="logo"><div class="mark">◒</div>Amanhã</div><button class="circle">?</button></div><div class="eyebrow">OLÁ, GEOVANE</div><div class="title">Sábado, 5 de setembro</div><div class="hero"><small>DINHEIRO LIVRE • 30 DIAS</small><h2>${fmt(m.free)}</h2><p>É a menor folga disponível no seu Horizonte, sem usar a Reserva Protegida.</p><button class="secondary" onclick="tab='horizon';render()">Ver Horizonte</button></div><div class="metrics"><div class="metric"><small>SALDO ATUAL</small><b>${fmt(state.balance)}</b></div><div class="metric"><small>COMPROMETIDO</small><b>${fmt(3220)}</b></div><div class="metric"><small>RESERVA PROTEGIDA</small><b>${fmt(state.reserve)}</b></div><div class="metric"><small>MENOR SALDO</small><b>${fmt(m.min)}</b></div></div><div class="section"><h3>Controle rápido</h3><div class="quick"><button onclick="openMoves()"><b>Próximos movimentos</b><small>Contas, entradas e parcelas</small></button><button onclick="openSim()"><b>Impacto no Amanhã</b><small>Simule antes de comprar</small></button></div></div></section>`}function horizon(){const a=daily(yr,mo),first=new Date(yr,mo,1).getDay(),m=metrics(),now=new Date(2026,8,5);let cells='';for(let i=0;i<first;i++)cells+='<div class="cell blank"></div>';for(const x of a){const t=tone(x.b,yr,mo,x.d),today=yr===now.getFullYear()&&mo===now.getMonth()&&x.d===now.getDate()?' todayday':'';cells+=`<div class="cell ${t}${today}"><button onclick="openDay(${x.d})"><strong>${x.d}</strong><em>${short(x.b)}</em></button></div>`}$('#content').innerHTML=`<section class="page"><div class="top"><div><div class="eyebrow">HORIZONTE DIÁRIO</div><div class="title">${months[mo]} de ${yr}</div></div><button class="circle" onclick="openAdd()">＋</button></div><div class="monthnav"><button onclick="change(-1)">‹</button><strong>${months[mo]} de ${yr}</strong><button onclick="change(1)">›</button><button class="today" onclick="todayMonth()">Voltar para este mês</button></div><div class="week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div><div class="cal">${cells}</div><div class="legend"><span><i class="a"></i>Confortável</span><span><i class="b"></i>Atenção</span><span><i class="c"></i>Apertado</span></div><div class="strip"><div><small>MENOR SALDO</small><b>${short(m.min)}</b></div><div><small>DINHEIRO LIVRE</small><b>${short(m.free)}</b></div><div><small>RESERVA</small><b>${short(state.reserve)}</b></div></div><button class="simulate" onclick="openSim()">Simular uma compra neste Horizonte</button></section>`}function cards(){let h=state.cards.map((c,i)=>`<div class="cardbox"><div class="eyebrow">CARTÃO ${i+1}</div><h3>${c.name}</h3><p>Fatura atual <b>${fmt(c.bill)}</b></p><p style="color:var(--muted);font-size:12px">Vence dia ${c.due} · limite ${fmt(c.limit)}</p><button class="secondary" onclick="openCard(${i})">Ver fatura</button></div>`).join('');$('#content').innerHTML=`<section class="page"><div class="top"><div><div class="eyebrow">CARTÕES</div><div class="title">Seus cartões</div></div><button class="circle" onclick="openAdd()">＋</button></div>${h}</section>`}function profile(){$('#content').innerHTML=`<section class="page"><div class="top"><div><div class="eyebrow">PERFIL</div><div class="title">Geovane</div></div><div class="mark">GF</div></div><div class="menu"><button onclick="openSheet('CONFIGURAÇÕES','Preferências','Notificações, segurança e privacidade do protótipo.')"><span><b>Configurações</b><br><small>Notificações e segurança</small></span><span>›</span></button><button onclick="openSheet('RESERVA PROTEGIDA','Sua reserva',`Valor protegido: <b>${fmt(state.reserve)}</b><br><br>Esse valor não entra no Dinheiro Livre.`)"><span><b>Reserva Protegida</b><br><small>Meta e proteção</small></span><span>›</span></button><button onclick="openSheet('PLANO','Amanhã Plus','Horizonte completo, simulações e recursos avançados.')"><span><b>Assinatura</b><br><small>Amanhã Plus</small></span><span>›</span></button><button onclick="openSheet('AJUDA','Como calculamos?','O Horizonte combina saldo, renda, compromissos recorrentes e orçamento flexível para projetar cada dia.')"><span><b>Ajuda</b><br><small>Entenda os cálculos</small></span><span>›</span></button></div></section>`}function change(n){const d=new Date(yr,mo+n,1);yr=d.getFullYear();mo=d.getMonth();render();scrollTo(0,0)}function todayMonth(){yr=2026;mo=8;render()}function openSheet(e,t,b){$('#sheetEye').textContent=e;$('#sheetTitle').textContent=t;$('#sheetBody').innerHTML=b;$('#sheet').classList.add('open')}function closeSheet(){$('#sheet').classList.remove('open')}function openDay(d){const a=daily(yr,mo),x=a[d-1],start=d===1?monthStart(yr,mo):a[d-2].b;openSheet('DETALHE DO DIA',`${d} de ${months[mo]}`,`<div class="strip"><div><small>INÍCIO</small><b>${short(start)}</b></div><div><small>MOVIMENTOS</small><b>${x.items.length}</b></div><div><small>FIM</small><b>${short(x.b)}</b></div></div><div class="list" style="margin-top:14px">${x.items.length?x.items.map(i=>`<div class="row"><div><b>${i.name}</b><small>Dia ${i.d}</small></div><b class="${i.t}">${fmt(i.v)}</b></div>`).join(''):'<p style="color:var(--muted)">Nenhum lançamento específico neste dia.</p>'}</div><button class="simulate" onclick="openSim()">Simular compra a partir deste dia</button>`)}function openMoves(){openSheet('MOVIMENTOS','Próximos movimentos',`<div class="list">${state.tx.map(i=>`<div class="row"><div><b>${i.name}</b><small>Dia ${i.d} · recorrente</small></div><b class="${i.t}">${fmt(i.v)}</b></div>`).join('')}</div>`)}function openAdd(){openSheet('ADICIONAR','O que aconteceu?',`<div class="actions"><button onclick="entry(1)"><b>Entrada</b><small>Salário, comissão, extra</small></button><button onclick="entry(-1)"><b>Saída</b><small>Conta, boleto, compra</small></button><button onclick="openSim()"><b>Simular compra</b><small>Impacto no Amanhã</small></button></div>`)}function entry(sign){openSheet(sign>0?'NOVA ENTRADA':'NOVA SAÍDA',sign>0?'Recebi dinheiro':'Gastei dinheiro',`<div class="field"><label>Descrição</label><input id="en" value="${sign>0?'Renda extra':'Nova compra'}"></div><div class="field"><label>Valor</label><input id="ev" type="number" value="200"></div><div class="field"><label>Dia</label><input id="ed" type="number" value="12"></div><button class="primary" style="width:100%" onclick="saveEntry(${sign})">Salvar</button>`)}function saveEntry(sign){state.tx.push({name:$('#en').value,v:sign*(+$('#ev').value||0),d:+$('#ed').value||1,t:sign>0?'in':'out',rec:false});closeSheet();render();toast('Horizonte recalculado.')}function openSim(){openSheet('IMPACTO NO AMANHÃ','Simular uma compra',`<div class="field"><label>Valor da compra</label><input id="sv" type="number" value="1200"></div><button class="primary" style="width:100%" onclick="calcSim()">Comparar caminhos</button><div id="simout"></div>`)}function calcSim(){const v=+$('#sv').value||0,m=metrics();const s=[['À vista',m.min-v],['3x',m.min-v/3],['6x',m.min-v/6],['Esperar até a renda',m.min+state.income-v]];$('#simout').innerHTML=s.map((x,i)=>`<div class="cardbox"><div class="eyebrow">${i===2?'MENOR IMPACTO MENSAL':''}</div><h3>${x[0]}</h3><p>Menor saldo previsto: <b>${fmt(x[1])}</b></p></div>`).join('')}function openCard(i){const c=state.cards[i];openSheet('FATURA',c.name,`<div class="hero" style="margin-top:0"><small>FATURA ATUAL</small><h2>${fmt(c.bill)}</h2><p>Vence dia ${c.due}</p></div><div class="list"><div class="row"><div><b>Vídeo game · 1/5</b><small>Parcela ativa</small></div><b class="out">${fmt(-720)}</b></div><div class="row"><div><b>Streaming</b><small>Recorrente</small></div><b class="out">${fmt(-40.9)}</b></div></div>`)}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});$('#plus').onclick=openAdd;</script></body></html>
