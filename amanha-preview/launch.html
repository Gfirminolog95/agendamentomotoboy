<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A1B55">
<title>Amanhã — V10 Full Test</title>
<style>
html,body{margin:0;height:100%;background:#2A1B55;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{height:100%;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;box-sizing:border-box}.logo{font-size:30px;font-weight:800;margin-bottom:10px}.msg{font-size:13px;opacity:.72;line-height:1.5;max-width:310px}.spinner{width:34px;height:34px;border:3px solid #ffffff33;border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}.retry{margin-top:18px;padding:12px 18px;border:0;border-radius:12px;background:#fff;color:#2A1B55;font-weight:700}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div><div class="spinner"></div><div class="logo">Amanhã</div><div class="msg">Preparando o protótipo completo…</div></div></div>
<script>
const SOURCE='https://raw.githubusercontent.com/Gfirminolog95/agendamentomotoboy/17174980e2fa674c51a3ea005d7ba74413fa5d4e/amanha-preview/index.html';
function decodeBase64Safe(input){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
  input=String(input||'').replace(/[^A-Za-z0-9+/=]/g,'');
  const out=[];
  for(let i=0;i<input.length;i+=4){
    const c1=chars.indexOf(input[i]);
    const c2=chars.indexOf(input[i+1]);
    const c3=input[i+2]==='='?-1:chars.indexOf(input[i+2]);
    const c4=input[i+3]==='='?-1:chars.indexOf(input[i+3]);
    if(c1<0||c2<0) continue;
    out.push((c1<<2)|(c2>>4));
    if(c3>=0) out.push(((c2&15)<<4)|(c3>>2));
    if(c4>=0) out.push(((c3&3)<<6)|c4);
  }
  return new Uint8Array(out);
}
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const r=await fetch(SOURCE+'?v=2',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar o pacote ('+r.status+').');
    const loader=await r.text();
    const m=loader.match(/const b64="([^"]+)"/);
    if(!m) throw new Error('Pacote do protótipo não encontrado.');
    if(!('DecompressionStream' in window)) throw new Error('Este navegador precisa ser atualizado para abrir o preview.');
    const bytes=decodeBase64Safe(m[1]);
    if(bytes.length<1000) throw new Error('Pacote incompleto.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const app=await new Response(stream).text();
    const ok=app.includes('Amanhã — V10 Full Test')&&app.includes('data-auth-screen="login"')&&app.includes('id="screen-horizon"')&&app.includes('id="screen-cards"')&&app.includes('id="screen-profile"');
    if(!ok) throw new Error('Falha na validação do protótipo.');
    document.open();document.write(app);document.close();
  }catch(err){
    console.error(err);
    boot.innerHTML='<div><div class="logo">Não foi possível abrir</div><div class="msg">'+String(err&&err.message?err.message:err)+'</div><button class="retry" onclick="location.reload()">Tentar novamente</button></div>';
  }
})();
</script>
</body>
</html>
